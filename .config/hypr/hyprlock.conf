# ORTHANC / PHASE IV - Gates of Orthanc
# The desktop wallpaper configuration is NOT touched. Lock-screen backdrop is
# deliberately opaque so desktop content is not exposed to anyone nearby.
source = ~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(0b1519ff)
}

label {
    monitor =
    text = ORTHANC
    color = rgba(e4cc97ff)
    font_size = 52
    font_family = Cinzel
    position = 0, 330
    halign = center
    valign = center
}
label {
    monitor =
    text = THE GATES ARE WATCHED
    color = rgba(92b6a0ff)
    font_size = 16
    font_family = $font_family
    position = 0, 280
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(ebdbb2ff)
    font_size = 65
    font_family = $font_family_clock
    position = 0, 185
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] date +"%A, %d %B %Y"
    color = rgba(a8c5b5ff)
    font_size = 17
    font_family = $font_family
    position = 0, 132
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(e4cb9dff)
    font_size = 19
    font_family = $font_family
    position = 0, 60
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    outer_color = rgba(a68a5cff)
    inner_color = rgba(192e2cff)
    font_color = rgba(f0e0baff)
    check_color = rgba(7aaf89ff)
    fail_color = rgba(a4514dff)
    fade_on_empty = false
    placeholder_text = <i>Speak, friend, and enter</i>
    position = 0, -35
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/hyprlock/check-capslock.sh
    color = rgba(e1ad7aff)
    font_size = 14
    font_family = $font_family
    position = 0, -95
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT
    color = rgba(9dbcaaff)
    font_size = 13
    font_family = $font_family
    position = -26, 26
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:15000] ~/.config/hypr/hyprlock/status.sh
    color = rgba(b0c4adff)
    font_size = 13
    font_family = $font_family
    position = 26, -26
    halign = left
    valign = top
}
label {
    monitor =
    text = THE SEEING STONE IS SILENT
    color = rgba(728e83ff)
    font_size = 12
    font_family = $font_family
    position = 0, -175
    halign = center
    valign = center
}
